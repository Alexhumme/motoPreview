<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MotoPreview API{% endblock %}</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaf0; --muted:#9aa3b2; --line:rgba(128,128,128,.25);
          --accent:#ff5a1f; --ok:#2ecc71; --bad:#e74c3c; --head:#1f232c; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5f8; --card:#ffffff; --text:#1b1f27; --muted:#5b6575; --head:#eef0f5; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { background:var(--card); border-bottom:3px solid var(--accent); padding:14px 24px;
           display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; }
  .brand { font-weight:700; font-size:1.15rem; margin-right:8px; color:var(--text); text-decoration:none; }
  .brand span { color:var(--accent); }
  nav { display:flex; flex-wrap:wrap; gap:6px; flex:1; }
  nav a { color:var(--muted); text-decoration:none; padding:6px 12px; border-radius:999px;
          font-size:.9rem; border:1px solid transparent; }
  nav a:hover { color:var(--text); border-color:var(--line); }
  nav a.on { color:#fff; background:var(--accent); }
  .lang { display:flex; gap:4px; align-items:center; margin-left:auto; }
  .lang a { color:var(--muted); text-decoration:none; padding:4px 10px; border-radius:8px;
            font-size:.82rem; font-weight:600; border:1px solid var(--line); }
  .lang a:hover { color:var(--text); }
  .lang a.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { max-width:1200px; margin:0 auto; padding:28px 24px 48px; }
  h1 { margin:0; font-size:1.7rem; }
  h1 span { color:var(--accent); }
  .muted { color:var(--muted); }
  {% block styles %}{% endblock %}
</style>
</head>
<body>
<header>
  <a class="brand" href="/?lang={{ lang }}">Moto<span>Preview</span> API</a>
  <nav>{% for item in nav %}<a href="{{ item.href }}?lang={{ lang }}"{% if item.active %} class="on"{% endif %}>{{ item.label }}</a>{% endfor %}</nav>
  <div class="lang" aria-label="{{ T.language }}">{% for item in switch %}<a href="{{ item.url }}"{% if item.active %} class="on"{% endif %}>{{ item.code|upper }}</a>{% endfor %}</div>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
